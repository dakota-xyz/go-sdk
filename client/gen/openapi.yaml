                  description: Destination address (for transfer events)
                amount:
                  type: string
                  description: Transfer amount
                asset:
                  type: string
                  description: Asset being transferred
                network:
                  type: string
                  description: Blockchain network
                confirmations:
                  type: integer
                  description: Number of confirmations (for confirmation events)
      responses:
        '200':
          description: Blockchain event simulated successfully
          content:
