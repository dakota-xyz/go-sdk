      allOf:
        - $ref: '#/components/schemas/DestinationRequest'
        - type: object
          properties:
            destination_type:
              type: string
              enum: [ fiat_us ]
              default: fiat_us
            name:
              type: string
              description: "Name of the destination for reference"
              example: "Primary US Bank Account"
            aba_routing_number:
              type: string
              example: "123456789"
            aba_wire_routing_number:
              type: string
              example: "123456789"
            account_number:
              type: string
              example: "123456789"
            account_type:
              type: string
              enum: [ checking, savings ]
              example: "checking"
            account_holder_name:
              type: string
              example: "John Doe"
            account_holder_address:
              $ref: '#/components/schemas/Address'
            account_holder_phone:
              type: string
              example: "1234567890"
            bank_name:
              type: string
              example: "Bank of America"
            bank_address:
              description: "Address of the bank. Optional for US domestic transfers."
