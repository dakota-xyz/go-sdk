  # Onboarding Application API paths

  # New unified endpoints
  /applications:
    get:
      tags:
        - Onboarding
      summary: List all onboarding applications
      description: |
        Returns a paginated list of your onboarding applications for both businesses and individuals.
        Use the `type` parameter to filter by application type, and `status` to filter by application status.
        Supports cursor-based pagination using `starting_after`, `ending_before`, and `limit` parameters.

        **Authentication:** Accepts API Key (X-API-Key header).
      operationId: listApplications
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by application type
          schema:
            type: string
            enum:
              - business
              - individual
        - name: status
          in: query
          required: false
          description: Filter by application status
          schema:
            type: string
            enum:
              - pending
              - submitted
              - completed
        - $ref: '#/components/parameters/StartingAfterParam'
        - $ref: '#/components/parameters/EndingBeforeParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationListItem'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{application_id}:
    get:
      tags:
        - Onboarding
      summary: Get an onboarding application
      description: |
        Retrieves a specific application including its status, entities (business/individuals), validation state,
        attestations, and EDD data if applicable. The validation object shows whether the application is ready
        to submit and what requirements are missing.

        **Authentication:** Accepts Application Token (X-Application-Token header).
        Application tokens are scoped to a single application for use in public-facing flows.
      operationId: getApplication
      parameters:
