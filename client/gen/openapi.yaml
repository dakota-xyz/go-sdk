        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCheckbookClientCredentialsRequest'
      responses:
        "200":
          description: Checkbook client credentials updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckbookClientCredentialsResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Internal
      summary: Delete (deactivate) Checkbook client credentials
      description: Soft-deletes Checkbook client credentials by setting is_active to false. Requires super admin privileges.
      operationId: deleteCheckbookClientCredentials
      responses:
        "204":
          description: Checkbook client credentials deleted successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
