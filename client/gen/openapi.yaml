openapi: 3.0.3
info:
  title: Dakota Platform API
  version: "1.0.0"
  description: |
    Combined API specification for Dakota Platform services:
    - Issuance API: Asset minting and burning operations
    - Onboarding API: Know Your Business/Customer verification
    - On/Off Ramp API: Managing on-ramp and off-ramp accounts
    - Recipients API: Managing destinations for KYB'd entities
    - Transactions API: Viewing transaction history across platform operations
    
    ## Authentication and API Headers
    
    All API endpoints require the following headers:
    
    - `x-idempotency-key`: Required for all POST endpoints to ensure request idempotency
    - `x-api-key`: Required for authentication across all endpoints

    Note: On /applications endpoints you need a token for authentication isntead of a x-api-key
    - `x-application-token`: Required for all POST endpoints to ensure request idempotency

servers:
  - url: https://api.platform.dakota.xyz
  - url: https://api.platform.sandbox.dakota.xyz
  - url: https://api.platform.dev.dakota.xyz
  - url: http://localhost:6464
security:
  - ApiKeyAuth: [ ]
tags:
  - name: Authentication
    description: Authentication and API key management
  - name: Billing
    description: Billing invoice management and generation
  - name: Auto Transactions
    description: Managing auto account transactions
  - name: Customers
    description: Customer management and lifecycle operations
  - name: Issuance
    description: Asset minting and burning operations
  - name: Onboarding
    description: Managing verifications for customers and businesses
  - name: Onramp
    description: Managing on-ramp accounts for fiat-to-crypto conversions
  - name: Offramp
    description: Managing off-ramp accounts for crypto-to-fiat conversions
  - name: Swap
    description: Managing swap accounts for crypto-to-crypto conversions
  - name: Recipients
    description: Managing destinations for KYB'd entities
  - name: Transactions
    description: Viewing and managing transaction history including Transaction and ProcessTransaction models
  - name: Info
    description: Informational endpoints for system capabilities
  - name: Inbound Webhooks
    description: Webhook endpoints for receiving external service events
  - name: Webhooks
    description: Webhook endpoints for sending events
  - name: Events
    description: Event logging and retrieval across platform operations
  - name: Exceptions
    description: Managing platform exceptions and error conditions
  - name: Users
    description: User management
  - name: Wallets
    description: Wallet management and multi-chain address operations
  - name: Signer Groups
    description: Signer group management
  - name: Policies
    description: Managing policies and policy rules for transaction governance
  - name: Internal
    description: Internal views and administrative endpoints
paths:
  /auto-transactions:
    get:
      tags:
        - Auto Transactions
      summary: List transactions that were created automatically by auto accounts
      operationId: listAutoTransactions
      parameters:
        - $ref: '#/components/parameters/StartingAfterParam'
        - $ref: '#/components/parameters/EndingBeforeParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: auto_account_id
          in: query
          description: Filter transactions by auto account ID
          required: false
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: destination_id
          in: query
          description: Filter transactions by destination ID
          required: false
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: status
          in: query
          description: Filter transactions by status
          required: false
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: type
          in: query
          description: Filter transactions by type
          required: false
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: provider_id
          in: query
          description: Filter transactions by provider ID
          required: false
          schema:
            type: string
        - name: source_crypto_address
          in: query
          description: Filter transactions by source address
          required: false
          schema:
            type: string
        - name: destination_crypto_address
          in: query
          description: Filter transactions by destination address
          required: false
          schema:
            type: string
        - name: source_network_id
          in: query
          description: Filter transactions by source network
          required: false
          schema:
            type: string
        - name: destination_network_id
          in: query
          description: Filter transactions by destination network
          required: false
          schema:
            type: string
        - name: transaction_hash
          in: query
          description: Filter transactions by blockchain transaction hash
          required: false
          schema:
            type: string
        - name: start_date
          in: query
          description: Filter transactions created on or after this date (Epoch timestamp in seconds)
          required: false
          schema:
            type: integer
        - name: end_date
          in: query
          description: Filter transactions created on or before this date (Epoch timestamp in seconds)
          required: false
          schema:
            type: integer
        - name: input_asset
          in: query
          description: Filter transactions by input asset symbol
          required: false
          schema:
            type: string
        - name: destination_asset
          in: query
          description: Filter transactions by destination asset symbol
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 'A paginated list of auto account transactions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAutoTransactionResponse'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auto-transactions/{auto_transaction_id}:
    get:
      tags:
        - Auto Transactions
      summary: Get details of a specific auto account transaction
      operationId: getAutoTransaction
      parameters:
        - name: auto_transaction_id
          in: path
          required: true
          description: Unique identifier of the auto account transaction
          schema:
            $ref: '#/components/schemas/KSUID'
      responses:
        "200":
          description: Auto account transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoAccountTransaction'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
