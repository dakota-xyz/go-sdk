    post:
      tags:
        - Inbound Webhooks
        - Internal
      summary: Webhook endpoint for Allium blockchain data
      operationId: webhooksIngestAllium
      description: |
        Receives Google Pub/Sub webhook notifications from Allium containing
        blockchain transaction data. Processes and stores to TimescaleDB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - subscription
              properties:
                message:
                  type: object
                  required:
                    - data
                    - messageId
                  properties:
                    data:
                      type: string
                      description: Base64-encoded message data
                    messageId:
                      type: string
                      description: Unique message identifier
                    publishTime:
                      type: string
                      format: date-time
                      description: Message publish timestamp
                    attributes:
                      type: object
                      additionalProperties:
                        type: string
                      description: Message attributes
                subscription:
                  type: string
                  description: Pub/Sub subscription ID (dot-separated format)
                  example: "allium_app.dakota.ethereum_sepolia.transactions.pull"
                deliveryAttempt:
                  type: integer
                  description: Delivery attempt number
      responses:
        "200":
          description: Message received and processed (or saved to failed queue)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid request format
