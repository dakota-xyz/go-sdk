  /signers/{public_key}:
    delete:
      tags:
        - Signer Groups
      summary: Delete a signer by public key
      description: Soft-deletes all signers with the given public key. This operation is idempotent - it will succeed even if the signer does not exist. Returns an error if the signer is a member of any active signer groups.
      operationId: deleteSigner
      parameters:
        - name: public_key
          in: path
          required: true
          description: The public key of the signer to delete
          schema:
            type: string
      responses:
        "204":
          description: Signer deleted successfully (or already deleted/non-existent)
        "400":
          description: Bad request - invalid public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden - lacks DeleteSigner permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Conflict - signer is in an active signer group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
