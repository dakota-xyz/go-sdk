  # Checkbook KYB Admin API paths
  /internal/checkbook/kyb-status/{customer_id}:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
        description: The customer ID (KSUID)
    patch:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
