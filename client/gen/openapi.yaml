    # Transaction API schemas
    Transaction:
      type: object
      description: "A unified transaction object representing money movements in the Dakota platform."
      required:
        - id
        - type
        - status
        - description
        - inputAmount
        - subtotalAmount
        - convertedAmount
        - outputAmount
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        description:
          type: string
          description: "Human-readable description of the transaction."
          example: "USD to ETH conversion"
        inputAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: "The amount of money input into the transaction."
        subtotalAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: "TODO @Marc what does this mean specifically?"
        convertedAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: "TODO @Marc what does this mean specifically?"
        outputAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: "The amount of money output from the transaction."
        settlement:
          $ref: '#/components/schemas/TransactionSettlement'
        components:
          type: array
          description: "List of component transactions for composite transactions."
          items:
            $ref: '#/components/schemas/NestedTransaction'
          nullable: true
        createdAt:
          type: integer
          description: "Unix timestamp when the transaction was created."
          example: 1234567890
        updatedAt:
          type: integer
          description: "Unix timestamp when the transaction was last updated."
          example: 1234567890
        completedAt:
          type: integer
          description: "Unix timestamp when the transaction was completed. Null if not completed."
          nullable: true
          example: 1234567890

    TransactionAmount:
      type: object
      description: "An amount of money with its asset."
      required:
        - amount
        - asset
      properties:
        amount:
          type: string
          description: "The amount as a decimal string."
          example: "1000.00"
        asset:
          type: string
          description: "The asset code or asset symbol."
          example: "USD"

    TransactionSettlement:
      type: object
      description: "Settlement details for a transaction."
      properties:
        txnHash:
          type: string
          description: "Transaction hash for crypto transactions."
          nullable: true
        imad:
          type: string
          description: "Input Message Accountability Data for certain US transactions."
          nullable: true
        omad:
          type: string
          description: "Output Message Accountability Data for certain US transactions."
          nullable: true

    NestedTransaction:
      type: object
      description: "A transaction object for use within composite transactions (without further nesting)."
      required:
        - id
        - type
        - status
        - description
        - inputAmount
        - subtotalAmount
        - convertedAmount
        - outputAmount
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        description:
          type: string
        inputAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: "The amount of money input into the transaction."
        subtotalAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: "TODO @Marc what does this mean specifically?"
        convertedAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: "TODO @Marc what does this mean specifically?"
        outputAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: "The amount of money output from the transaction."
        settlement:
          $ref: '#/components/schemas/TransactionSettlement'
        createdAt:
          type: integer
          description: "Unix timestamp when the transaction was created."
          example: 1234567890
        updatedAt:
          type: integer
          description: "Unix timestamp when the transaction was last updated."
          example: 1234567890
        completedAt:
          type: integer
          description: "Unix timestamp when the transaction was completed. Null if not completed."
          nullable: true
          example: 1234567890

    # Transaction estimate schemas
    TransactionEstimateRequest:
      type: object
      description: |
        Request for estimating transaction options based on source and destination.
        
        Note that the schema for source and destination details will vary based on the account type 
        (crypto, fiat_us, or fiat_iban) selected in the accountType field.
      required:
        - sourceDetails
        - destinationDetails
        - amount
      properties:
        sourceDetails:
          $ref: '#/components/schemas/AccountDetailsUnion'
        destinationDetails:
          $ref: '#/components/schemas/AccountDetailsUnion'
        amount:
          type: string
          description: "Amount to transfer as a decimal string."
          example: "1000.00"
        sourceAsset:
          type: string
          description: "Currency code or asset symbol of the source. Required for crypto sources."
          example: "USD"
        destinationAsset:
          type: string
          description: "Desired currency code or asset symbol at the destination. Used for currency conversion transactions."
          example: "EUR"

    # Schema for account details union with discriminator
    ProviderOptionsResponse:
      type: object
      title: "Provider Options Response"
      description: "Response containing available provider options for a customer."
      required:
        - default
        - options
      properties:
        default:
          type: string
          description: "The default provider ID to use for the requested capability."
          example: "dakota"
        options:
          type: array
          description: "List of available provider options."
          items:
            $ref: '#/components/schemas/ProviderOption'

    ProviderOption:
      type: object
      title: "Provider Option"
      description: "Information about a provider option for a customer."
      required:
        - name
        - capabilities
        - fee_flat
        - fee_bps
      properties:
        name:
          type: string
          description: "Unique identifier of the provider."
          example: "dakota"
        capabilities:
          type: array
          description: "List of payment capabilities supported by this provider."
          items:
            $ref: '#/components/schemas/PaymentCapability'
          example: [ "swift", "sepa" ]
        fee_flat:
          type: number
          format: float
          description: "Flat fee in destination asset."
          example: 12.34
        fee_bps:
          type: integer
          description: "Basis points fee (1 basis point = 0.01%)."
          example: 5
        minimums:
          type: array
          description: "Minimum transaction amounts for different rails."
          items:
            type: object
            required:
              - rail
              - minimum
              - asset
            properties:
              rail:
                $ref: '#/components/schemas/PaymentCapability'
              minimum:
                type: number
                description: "Minimum transaction amount for this rail."
                example: 5
              asset:
                $ref: '#/components/schemas/Asset'

    AccountDetailsUnion:
      title: "Account Details Union"
      description: "Union type for different account details with accountType discriminator"
      oneOf:
        - $ref: '#/components/schemas/CryptoAccountDetails'
        - $ref: '#/components/schemas/FiatUSAccountDetails'
        - $ref: '#/components/schemas/FiatIBANAccountDetails'
      discriminator:
        propertyName: accountType
        mapping:
          crypto: '#/components/schemas/CryptoAccountDetails'
          fiat_us: '#/components/schemas/FiatUSAccountDetails'
          fiat_iban: '#/components/schemas/FiatIBANAccountDetails'

    # Account details schemas - Base type with discriminator
    AccountDetails:
      type: object
      title: "Account Details"
      description: "Base schema for account details with a discriminator based on account type."
      required:
        - accountType
      properties:
        accountType:
          type: string
          description: "Type of account, used as a discriminator to determine schema."
          enum: [ crypto, fiat_us, fiat_iban ]
          example: "fiat_us"
      discriminator:
        propertyName: accountType
        mapping:
          crypto: '#/components/schemas/CryptoAccountDetails'
          fiat_us: '#/components/schemas/FiatUSAccountDetails'
          fiat_iban: '#/components/schemas/FiatIBANAccountDetails'
    
    # Crypto account details
    CryptoAccountDetails:
      type: object
      title: "Crypto Account Details"
      description: "Account details for a cryptocurrency wallet."
      allOf:
        - $ref: '#/components/schemas/AccountDetails'
        - type: object
          required:
            - network
            - crypto_address
          properties:
            network:
              type: string
              description: "Blockchain network for the crypto account."
              example: "ethereum-mainnet"
            crypto_address:
              type: string
              description: "Wallet address for the crypto account."
              example: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
    
    # US fiat account details
    FiatUSAccountDetails:
      type: object
      title: "US Fiat Account Details"
      description: "Account details for a US bank account."
      allOf:
        - $ref: '#/components/schemas/AccountDetails'
        - type: object
          required:
            - routingNumber
            - accountNumber
            - bankAccountType
          properties:
            routingNumber:
              type: string
              description: "ABA routing number for the US bank account."
              example: "123456789"
            accountNumber:
              type: string
              description: "Account number for the US bank account."
              example: "987654321"
            bankAccountType:
              type: string
              description: "Type of US bank account."
              enum: [ checking, savings ]
              example: "checking"
            accountHolderName:
              type: string
              description: "Name of the account holder (optional for US accounts)."
              example: "John Doe"
    
    # IBAN account details (for SWIFT and SEPA transfers)
    FiatIBANAccountDetails:
      type: object
      title: "IBAN Fiat Account Details"
      description: "Account details for an IBAN bank account (for SWIFT and SEPA transfers)."
      allOf:
        - $ref: '#/components/schemas/AccountDetails'
        - type: object
          required:
            - iban
            - accountHolderName
          properties:
            iban:
              type: string
              description: "IBAN (International Bank Account Number) for the account."
              example: "DE89370400440532013000"
            bic:
              type: string
              description: "BIC/SWIFT code for the international bank account (optional for SEPA, required for SWIFT)."
              example: "DEUTDEFFXXX"
            accountHolderName:
              type: string
              description: "Name of the account holder."
              example: "John Doe"
            accountHolderAddress:
              $ref: '#/components/schemas/Address'

    TransactionEstimateResponse:
      type: object
      description: "Response containing available transaction options with estimates."
      required:
        - options
      properties:
        options:
          type: array
          description: "Available transaction options."
          items:
            $ref: '#/components/schemas/TransactionOption'
    
    TransactionOption:
      type: object
      description: "A transaction option with estimated duration and cost details."
      required:
        - transactionType
        - estimatedDuration
        - estimatedFees
      properties:
        transactionType:
          type: string
          description: "Type of transaction."
          enum: [ onramp, offramp, swap, transfer ]
          example: "swap"
        estimatedDuration:
          type: object
          description: "Estimated duration for the transaction to complete."
          required:
            - minMinutes
            - maxMinutes
          properties:
            minMinutes:
              type: integer
              description: "Minimum estimated time in minutes."
              example: 30
            maxMinutes:
              type: integer
              description: "Maximum estimated time in minutes."
              example: 120
        estimatedFees:
          type: object
          description: "Estimated fees for the transaction."
          required:
            - amount
            - asset
          properties:
            amount:
              type: string
              description: "Fee amount as a decimal string."
              example: "25.50"
            asset:
              type: string
              description: "Asset of the fee."
              example: "USDC"
            breakdown:
              type: array
              description: "Detailed breakdown of fees."
              items:
                type: object
                properties:
                  description:
                    type: string
                    description: "Description of the fee component."
                    example: "Network fee"
                  amount:
                    type: string
                    description: "Amount of this fee component."
                    example: "10.00"
        sourceAsset:
          type: string
          description: "Asset or asset symbol at the source."
          example: "USD"
        destinationAsset:
          type: string
          description: "Asset or asset symbol at the destination."
          example: "EUR"
        estimatedExchangeRate:
          type: number
          description: "Estimated exchange rate for asset conversion, if applicable."
          example: 1.05
        requiresKYC:
          type: boolean
          description: "Indicates whether this option requires KYC verification."
          example: true
        processSteps:
          type: array
          description: "High-level steps that will be performed for this transaction option."
          items:
            type: object
            properties:
              step:
                type: string
                description: "Name of the step."
                example: "Bank wire transfer"
              estimatedDurationMinutes:
                type: integer
                description: "Estimated duration of this step in minutes."
                example: 60

    # Webhook Target Schemas
    WebhookTarget:
      type: object
      description: "A webhook target for receiving outbound webhook events"
      required:
        - id
        - url
        - global
        - time_last_healthy
        - time_last_attempted
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        url:
          type: string
          format: uri
          description: "The URL where webhook events will be sent"
          example: "https://example.com/webhooks/receive"
        global:
          type: boolean
          description: "If true, this target will receive all event types"
          example: false
        event_types:
          type: array
          description: "List of event types this target cares about (ignored if global is true)"
          items:
            type: string
            example: "api_key.created"
        time_last_healthy:
          type: integer
          description: "Unix timestamp when this target last received a successful delivery (defaults to creation time if never healthy)"
        time_last_attempted:
          type: integer
          description: "Unix timestamp when a delivery to this target was last attempted (defaults to creation time if never attempted)"

    WebhookTargetCreateRequest:
      type: object
      description: "Request to create a new webhook target"
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: "The URL where webhook events will be sent"
          example: "https://example.com/webhooks/receive"
        global:
          type: boolean
          description: "If true, this target will receive all event types"
          example: false
          default: false
        event_types:
          type: array
          description: "List of event types this target cares about (ignored if global is true)"
          items:
            type: string
            example: "api_key.created"

    WebhookTargetUpdateRequest:
      type: object
      description: "Request to update an existing webhook target"
      properties:
        global:
          type: boolean
          description: "If true, this target will receive all event types"
          example: false
        event_types:
          type: array
          description: "List of event types this target cares about (ignored if global is true)"
          items:
            type: string
            example: "api_key.created"

    # Auto Account Transaction schemas
    AutoAccountTransaction:
      type: object
      description: "A transaction relating to an auto account"
      required:
        - id
        - client_id
        - auto_account_id
        - destination_id
        - type
        - provider_id
        - provider_external_id
        - provider_status
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        client_id:
          $ref: '#/components/schemas/KSUID'
        auto_account_id:
          $ref: '#/components/schemas/KSUID'
        destination_id:
          $ref: '#/components/schemas/KSUID'
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        failure_reason:
          type: string
          description: "Reason for failure if status is 'failed'"
        created_at:
          type: integer
          description: "Unix timestamp when the transaction was created."
          example: 1234567890
        updated_at:
          type: integer
          description: "Unix timestamp when the transaction was last updated."
          example: 1234567890
        completed_at:
          type: integer
          description: "Unix timestamp when the transaction was completed."
          example: 1234567890
        receipt:
          $ref: '#/components/schemas/TransactionReceipt'
        crypto_details:
          $ref: '#/components/schemas/TransactionCryptoDetails'

    AmountDetails:
      type: object
      description: "Detailed representation of an amount with its asset and optional metadata"
      required:
        - amount
        - asset
      properties:
        amount:
          type: string
          description: "Amount as a string representation of a decimal number"
        asset:
          type: string
          description: "Asset code"
        network:
          type: string
          description: "Network identifier for the token if it is a crypto asset"

    TransactionReceipt:
      type: object
      description: "Detailed receipt information for a transaction"
      required:
        - input
        - output
        - exchange_rate
      properties:
        imad:
          type: string
          description: "Input Message Accountability Data for certain US transactions."
        omad:
          type: string
          description: "Input Message Accountability Data for certain US transactions."
        input:
          $ref: '#/components/schemas/AmountDetails'
          description: "Input amount details"
        subtotal:
          $ref: '#/components/schemas/AmountDetails'
          description: "Subtotal amount after fees"
        converted:
          $ref: '#/components/schemas/AmountDetails'
          description: "Converted amount after applying the exchange rate"
        output:
          $ref: '#/components/schemas/AmountDetails'
          description: "Output amount details"
        exchange_rate:
          type: string
          description: "Exchange rate used for the transaction"
        external_fee:
          $ref: '#/components/schemas/AmountDetails'
          description: "External fee amount details"
        dakota_fee:
          $ref: '#/components/schemas/AmountDetails'
          description: "Dakota fee amount details"
        client_fee:
          $ref: '#/components/schemas/AmountDetails'
          description: "Client fee amount details"
        gas_fee:
          $ref: '#/components/schemas/AmountDetails'
          description: "Gas fee amount details for blockchain transactions"
        payment_reference:
          type: string
          description: "Payment reference message for bank transfers"
          nullable: true
          example: "Invoice payment for services"

    TransactionCryptoDetails:
      type: object
      description: "Blockchain-specific details for crypto transactions"
      properties:
        source_crypto_address:
          type: string
          description: "Source blockchain address"
        source_network_id:
          $ref: '#/components/schemas/NetworkId'
        destination_crypto_address:
          type: string
          description: "Destination blockchain address"
        destination_network_id:
          $ref: '#/components/schemas/NetworkId'
        deposit_transaction_hash:
          type: string
          description: "Transaction hash for intermediate transaction, such as the first half of an offramp or two-part swap"
        transaction_hash:
          type: string
          description: "Transaction hash for main transaction that reaches the recipient, if applicable"

    PaginatedAutoTransactionResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AutoAccountTransaction'

    # Exception schemas
    Exception:
      type: object
      description: "A platform exception"
      required:
        - id
        - exception_type
        - exception_type_description
        - content
        - created_at
      properties:
        id:
          type: string
          description: "Unique identifier for the exception"
          example: "exc_12345"
        customer_id:
          $ref: '#/components/schemas/KSUID'
        exception_type:
          type: string
          description: "Name of the exception type"
          example: "payment_failure"
        exception_type_description:
          type: string
          description: "Description of the exception type"
          example: "Payment processing failed due to insufficient funds"
        content:
          type: object
          description: "JSON content with exception details"
          additionalProperties: true
          example: { "error": "Payment failed", "code": "PAYMENT_DECLINED" }
        created_at:
          type: integer
          description: "When the exception was created"
        cleared_at:
          type: integer
          description: "When the exception was cleared (null if not cleared)"
          nullable: true

    ExceptionUpdateRequest:
      type: object
      description: "Request to update an exception"
      required:
        - cleared
      properties:
        cleared:
          type: boolean
          description: "Whether to mark the exception as cleared (true) or uncleared (false)"
          example: true

    PaginatedExceptionResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Exception'

    ProviderOnboardingResult:
      type: object
      description: "Result of onboarding a customer to one or more providers"
      required:
        - successful_providers
        - failed_providers
        - has_failures
      properties:
        successful_providers:
          type: array
          description: "List of providers that successfully onboarded the customer"
          items:
            $ref: '#/components/schemas/ProviderSuccess'
        failed_providers:
          type: array
          description: "List of providers that failed to onboard the customer"
          items:
            $ref: '#/components/schemas/ProviderError'
        has_failures:
          type: boolean
          description: "Whether any provider failures occurred during onboarding"
          example: false

    ProviderSuccess:
      type: object
      description: "Information about a successful provider onboarding"
      required:
        - provider_id
      properties:
        provider_id:
          type: string
          description: "Identifier of the provider"
          example: "bvnk"
        provider_customer_id:
          type: string
          nullable: true
          description: "Provider-specific customer reference ID"
          example: "bvnk_customer_123456"

    ProviderError:
      type: object
      description: "Information about a failed provider onboarding"
      required:
        - provider_id
        - error
      properties:
        provider_id:
          type: string
          description: "Identifier of the provider that failed"
          example: "bvnk"
        error:
          type: string
          description: "Error message describing the failure"
          example: "Customer validation failed: missing required documentation"


