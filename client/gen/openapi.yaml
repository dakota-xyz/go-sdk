  /internal/checkbook/client-credentials/{credential_id}:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
        description: The Checkbook client credentials ID
    get:
      tags:
        - Internal
      summary: Get Checkbook client credentials by ID
      description: Gets Checkbook client credentials by ID. Requires super admin privileges.
      operationId: getCheckbookClientCredentials
      responses:
        "200":
