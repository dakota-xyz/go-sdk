        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Queue item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /internal/unit21-backfill/start:
    post:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      tags:
        - Internal
      summary: Start a Unit21 backfill job
      description: Starts a background job to backfill all customer and transaction data to Unit21
      operationId: startUnit21Backfill
      responses:
        "200":
          description: Backfill job started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit21BackfillStartResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Service unavailable - Unit21 service not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /clients:
    get:
      tags:
        - Internal
      summary: List clients
      description: Lists all clients that this auth method has access to
      operationId: listClients
      responses:
        "200":
          description: 'List of clients the user has access to'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      tags:
        - Internal
      summary: Create a new client
      description: Creates a new subdeveloper client with all necessary setup. Requires super admin privileges (super admin JWT users or super user API keys).
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        "201":
          description: Client created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientResult'
        "400":
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden - insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Conflict - client already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clients/{client_id}/pricing:
    parameters:
      - name: client_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/KSUID'
    get:
      tags:
        - Clients
      summary: Get client pricing configuration
      description: Retrieve the pricing configuration for a specific client
      operationId: getClientPricing
      responses:
