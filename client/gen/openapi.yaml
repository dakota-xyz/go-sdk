  /applications/{application_id}/documents/{document_id}/verify:
    post:
      tags:
        - Onboarding
      summary: Verify a document upload
      description: |
        Verifies that a document was successfully uploaded to cloud storage using a presigned URL.
        Call this endpoint after uploading to the presigned URL to confirm the file exists and
        register it in the system. Use the upload_id returned from the presigned URL endpoint
        as the document_id.

        **Authentication:** Accepts Application Token (X-Application-Token header).
      operationId: verifyDocumentUpload
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: application_id
          in: path
          required: true
          description: The unique identifier for the application
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: document_id
          in: path
          required: true
          description: The document ID (upload_id from presigned URL response)
          schema:
            $ref: '#/components/schemas/KSUID'
      security:
        - ApplicationTokenAuth: []
      responses:
        "201":
          description: Document verified and registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        "400":
          description: Invalid request or verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Application not found or document not found in storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{application_id}/documents/{document_id}:
    get:
      tags:
        - Onboarding
      summary: Download a document
      description: |
        Downloads a document by streaming it through the API server. Returns the file with appropriate
        content type and disposition headers.

        **Authentication:** Accepts API Key (x-api-key header) or Application Token (X-Application-Token header).
      operationId: downloadDocument
      parameters:
        - name: application_id
          in: path
          required: true
          description: The unique identifier for the application
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: document_id
          in: path
          required: true
          description: The unique identifier for the document
          schema:
            $ref: '#/components/schemas/KSUID'
      security:
        - ApiKeyAuth: [ ]
        - ApplicationTokenAuth: []
      responses:
        "200":
          description: Document downloaded successfully
          headers:
            Content-Type:
              description: Content type of file
              schema:
                type: string
              example: 'image/jpeg'
            Content-Disposition:
              description: Suggested filename for download
              schema:
                type: string
              example: 'attachment; filename="passport_20240115.pdf"'
            X-Document-Type:
              description: The type of document (e.g., certificate_of_incorporation, passport)
              schema:
                type: string
            X-File-Type:
              description: The file type (pdf, jpeg, png)
              schema:
                type: string
            X-Created-At:
              description: When the document was uploaded (ISO 8601 timestamp)
              schema:
                type: string
                format: date-time
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Application or document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Document upload is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Onboarding
      summary: Delete an onboarding document
      description: |
        Deletes a document from a pending onboarding application.
        Only documents from applications in 'pending' status can be deleted.
        Deletes both the database record and the file from cloud storage.

        **Authentication:** Accepts API Key (x-api-key header) or Application Token (X-Application-Token header).
      operationId: deleteOnboardingDocument
      parameters:
        - name: application_id
          in: path
          required: true
          description: The unique identifier for the application
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: document_id
          in: path
          required: true
          description: The unique identifier for the document to delete
          schema:
            $ref: '#/components/schemas/KSUID'
      security:
        - ApiKeyAuth: [ ]
        - ApplicationTokenAuth: []
      responses:
        "204":
          description: Document successfully deleted
