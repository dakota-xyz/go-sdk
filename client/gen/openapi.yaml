components:
  parameters:
    IdempotencyKeyHeader:
      name: x-idempotency-key
      in: header
      required: true
      description: Unique key to ensure request idempotency. If the same key is used within a certain time window, the original response will be returned instead of executing the request again.
      schema:
        type: string
        format: uuid
    StartingAfterParam:
      name: starting_after
      in: query
      required: false
      description: A cursor for use in pagination. `starting_after` is a KSUID for the object you are listing that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with ID `2B5J8KZ9N7M1K3P6Q8R4T7V9`, your subsequent call can include `starting_after=2B5J8KZ9N7M1K3P6Q8R4T7V9` in order to fetch the next page of the list.
      schema:
        $ref: '#/components/schemas/KSUID'
    EndingBeforeParam:
      name: ending_before
      in: query
      required: false
      description: A cursor for use in pagination. `ending_before` is a KSUID for the object you are listing that defines your place in the list. For instance, if you make a list request and receive 100 objects, starting with ID `2B5J8KZ9N7M1K3P6Q8R4T7V9`, your subsequent call can include `ending_before=2B5J8KZ9N7M1K3P6Q8R4T7V9` in order to fetch the previous page of the list.
      schema:
        $ref: '#/components/schemas/KSUID'
    LimitParam:
      name: limit
      in: query
      required: false
      description: A limit on the number of objects to be returned. Limit can range between 1 and 100, and the default is 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PersonaSignatureParam:
      name: Persona-Signature
      in: header
      required: true
      description: Used to verify the authenticity of the incoming webhook events from Persona. The signature is generated by hashing the request body with a secret key.
      schema:
        type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    ApplicationTokenAuth:
      type: apiKey
      in: header
      name: X-Application-Token
      description: |
        Application-specific token for public URL access. Generated when a customer is created.
        Provides access to a single application without requiring an API key.
        Token is valid for 30 days and rate-limited to 100 requests per hour.
  schemas:
    # AssetDeployment
    AssetDeployment:
      type: object
      required:
        - id
        - name
        - network_id
        - contract_address
        - token_standard
        - decimals
      properties:
        id:
          type: string
          description: "The symbol of the asset (e.g., USDC, ETH)"
          example: "USDC"
        name:
          type: string
          description: "The full name of the asset"
          example: "USD Coin"
        network_id:
          $ref: '#/components/schemas/NetworkId'
        contract_address:
          type: string
          description: "The contract address of the asset on the network"
          example: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
        token_standard:
          type: string
          description: "The token standard (e.g., erc20, spl)"
          example: "erc20"
        decimals:
          type: integer
          description: "The number of decimal places for this asset"
          example: 6

    # Client
    Client:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        name:
          type: string
          description: "Name of the client."
          example: "Acme Financial Services"
    # Create Client Request
    CreateClientRequest:
      type: object
      required:
        - client_name
        - user_first_name
        - user_last_name
        - user_email
      properties:
        client_name:
          type: string
          description: "Name of the new client organization"
          example: "Acme Financial Services"
        user_first_name:
          type: string
          description: "First name of the primary user for this client"
          example: "John"
        user_last_name:
          type: string
          description: "Last name of the primary user for this client"
          example: "Smith"
        user_email:
          type: string
          format: email
          description: "Email address of the primary user for this client"
          example: "john.smith@acme.com"
        bridge_subdeveloper_id:
          type: string
          description: "Bridge subdeveloper ID for this client. Required in production, optional in sandbox mode."
          example: "sub_dev_123456"
        dakota_organization_id:
          type: string
          format: uuid
          description: "Dakota organization ID (UUID) that maps to Platform customer external_id. Required in production, optional in sandbox mode."
          example: "71e335dd-da91-41a3-b1a5-b596e2f5e798"
    # Create Client Response
    CreateClientResult:
      type: object
      required:
        - client
        - setup_statuses
      properties:
        client:
          $ref: '#/components/schemas/Client'
        setup_statuses:
          type: object
          description: "Status of each setup step"
          required:
            - client_created
            - subdeveloper_added
            - user_created
            - stytch_user_created
            - bridge_customer_fetched
            - customer_copied
            - webhooks_setup
            - webhook_activated
            - webhook_key_stored
            - endorsements_synced
          properties:
            client_created:
              $ref: '#/components/schemas/SetupStepStatus'
            subdeveloper_added:
              $ref: '#/components/schemas/SetupStepStatus'
            user_created:
              $ref: '#/components/schemas/SetupStepStatus'
            stytch_user_created:
              $ref: '#/components/schemas/SetupStepStatus'
            bridge_customer_fetched:
              $ref: '#/components/schemas/SetupStepStatus'
            customer_copied:
              $ref: '#/components/schemas/SetupStepStatus'
            webhooks_setup:
              $ref: '#/components/schemas/SetupStepStatus'
            webhook_activated:
              $ref: '#/components/schemas/SetupStepStatus'
            webhook_key_stored:
              $ref: '#/components/schemas/SetupStepStatus'
            endorsements_synced:
              $ref: '#/components/schemas/SetupStepStatus'
    # Setup Step Status
    SetupStepStatus:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: "Whether this setup step completed successfully"
        error:
          type: string
          description: "Error message if step failed"
          nullable: true
        details:
          type: object
          description: "Additional details about the step execution"
          nullable: true
          additionalProperties: true
    # Client User
    ClientUser:
      type: object
      description: "User object representing a user in the system, including all clients they can access."
      required:
        - id
        - first_name
        - last_name
        - email
        - role
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        first_name:
          type: string
          description: "Given name of the user."
          example: "John"
        last_name:
          type: string
          description: "Surname of the user."
          example: "Doe"
        email:
          type: string
          description: "Email address of the user."
          example: "john@example.com"
        role:
            $ref: '#/components/schemas/ClientUserRole'
        is_super_admin:
          type: boolean
          description: "Whether the user is a super admin. Only populated if true."
          x-internal: true
        swift_enabled:
          type: boolean
          description: "Whether the client has SWIFT payments enabled."
        created_at:
          type: integer
          description: "Timestamp of when the user was created."
          example: 1234567890
    
    # Client User Role Enum
    ClientUserRole:
      type: string
      description: "Role that can be assigned to a client user"
      enum: [ "admin", "viewer" ]
      example: "admin"

    # Client Pricing Config
    ClientPricingConfig:
      type: object
      required:
        - monthlyMinimumCents
        - transferFeeBps
        - achFeeCents
        - wireFeeCents
        - sepaFeeCents
        - effectiveFrom
        - createdAt
        - updatedAt
      properties:
        monthlyMinimumCents:
          type: integer
          minimum: 0
          description: "Monthly minimum fee in cents"
          example: 10000
        transferFeeBps:
          type: number
          minimum: 0
          maximum: 10000
          description: "Transfer fee in basis points (0-10000, representing 0% to 100%)"
          example: 25
        achFeeCents:
          type: integer
          minimum: 0
          description: "Per-ACH transaction fee in cents"
          example: 100
        wireFeeCents:
          type: integer
          minimum: 0
          description: "Per-wire transaction fee in cents"
          example: 2500
        sepaFeeCents:
          type: integer
          minimum: 0
          description: "Per-SEPA transaction fee in cents"
          example: 150
        effectiveFrom:
          type: string
          format: date-time
          description: "When this pricing takes effect"
          example: "2024-01-01T00:00:00Z"
        createdAt:
          type: string
          format: date-time
          description: "When this pricing configuration was created"
          example: "2024-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: "When this pricing configuration was last updated"
          example: "2024-01-01T00:00:00Z"

    # Update Client Pricing Request (without timestamps)
    UpdateClientPricingRequest:
      type: object
      description: "Request to update client pricing configuration"
      required:
        - monthlyMinimumCents
        - transferFeeBps
        - achFeeCents
        - wireFeeCents
        - sepaFeeCents
        - effectiveFrom
      properties:
        monthlyMinimumCents:
          type: integer
          minimum: 0
          description: "Monthly minimum fee in cents"
          example: 50000
        transferFeeBps:
          type: number
          format: float
          minimum: 0
          maximum: 10000
          description: "Transfer fee in basis points (0-10000, representing 0% to 100%)"
          example: 18.0
        achFeeCents:
          type: integer
          minimum: 0
          description: "Per-ACH transaction fee in cents"
          example: 100
        wireFeeCents:
          type: integer
          minimum: 0
          description: "Per-wire transaction fee in cents"
          example: 2500
        sepaFeeCents:
          type: integer
          minimum: 0
          description: "Per-SEPA transaction fee in cents"
          example: 150
        effectiveFrom:
          type: string
          format: date-time
          description: "When this pricing takes effect"
          example: "2025-01-01T00:00:00Z"

    # Create Client User Request
    CreateClientUserRequest:
      type: object
      description: "Request body for creating a new client user"
      required:
        - first_name
        - last_name
        - email
        - role
      properties:
        first_name:
          type: string
          description: "Given name of the user"
          example: "John"
          minLength: 1
        last_name:
          type: string
          description: "Surname of the user"
          example: "Doe"
          minLength: 1
        email:
          type: string
          format: email
          description: "Email address of the user"
          example: "john@example.com"
        role:
          $ref: '#/components/schemas/ClientUserRole'
    
    # Update Client User Request
    UpdateClientUserRequest:
      type: object
      description: "Request body for updating a client user"
      properties:
        first_name:
          type: string
          description: "Given name of the user"
          example: "John"
          minLength: 1
        last_name:
          type: string
          description: "Surname of the user"
          example: "Doe"
          minLength: 1
        role:
          $ref: '#/components/schemas/ClientUserRole'
    # Pagination list response wrapper
    PaginatedListResponse:
      type: object
      description: "Wrapper for paginated list responses"
      required:
        - data
        - meta
      properties:
        data:
          type: array
          description: "List of objects returned by the API"
          items:
            type: object
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      description: "Meta information about the response"
      required:
        - total_count
        - has_more_after
        - has_more_before
      properties:
        total_count:
          type: integer
          description: "Total number of items available"
          example: 100
        has_more_after:
          type: boolean
          description: "Indicates whether there are more items that follow this set."
          example: true
        has_more_before:
          type: boolean
          description: "Indicates whether there are more items that precede this set."
          example: false
        limit_reached:
          type: boolean
          description: "Indicates whether the configured limit for this resource type has been reached. Only appears on lists of resources that have limits."
          example: false

    # Error schema
    Error:
      type: object
      description: "Standard error response format for all API errors"
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "Error code that can be used for error handling"
          example: "invalid_request"
        message:
          type: string
          description: "Human readable error message"
          example: "The request was invalid. Please check your input and try again."
        details:
          type: object
          description: "Additional error details that might help with debugging"
          additionalProperties: true
          example: { "field": "amount", "issue": "must be greater than 0" }

    # Event schemas
    Event:
      type: object
      description: "A platform event"
      required:
        - event_id
        - type
        - content
      properties:
        event_id:
          $ref: '#/components/schemas/KSUID'
        type:
          type: string
          description: "Type of event"
          example: "user.created"
        content:
          type: object
          description: "JSON object containing event details; varies by event type"
          additionalProperties: true

    PaginatedEventResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Event'

    NetworkId:
      type: string
      description: "Identifier for a blockchain network"
      example: "ethereum-mainnet"
      enum: [
        "ethereum-mainnet",
        "ethereum-sepolia",
        "ethereum-goerli",
        "ethereum-holesky",
        "solana-mainnet",
        "solana-devnet",
        "solana-testnet",
        "base-mainnet",
        "base-sepolia",
        "arbitrum-mainnet",
        "arbitrum-sepolia",
        "optimism-mainnet",
        "optimism-sepolia",
        "avalanche-mainnet",
        "avalanche-fuji",
        "polygon-mainnet",
        "polygon-amoy"
      ]
      minLength: 1
      maxLength: 30

    # API Key schemas
    ApiKeyResponse:
      type: object
      required:
        - id
        - key
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        key:
          type: string
          description: "The API key value (only shown once at creation)"
          example: "dk_live_4KLkSmzQbL6Xs8xnUjssdGHX7PfhHpAb"
    
    ApiKeyListItem:
      type: object
      required:
        - id
        - user_id
        - key_suffix
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        user_id:
          $ref: '#/components/schemas/KSUID'
        key_suffix:
          type: string
          description: "Last six characters of the API key"
          example: "HpAb4a"
        created_at:
          type: integer
          description: "Timestamp of when the API key was created"
          example: 1234567890
    
    # Common schemas
    KSUID:
      type: string
      title: "KSUID"
      description: "KSUID is a 27-character globally unique ID that combines a timestamp with a random component. Used for all entity identifiers in the Dakota platform."
      pattern: "^[0-9A-Za-z]{27}$"
      minLength: 27
      maxLength: 27
      example: "1NFHrqBHb3cTfLVkFSGmHZqdDPi"

    CRI:
      type: object
      title: "Crypto Resource Identifier"
      description: "A unique identifier for a specific account on a specific blockchain. When rendered as a string, it has the syntax: <network-id>://<canonical-address> (e.g., ethereum-mainnet://0x165cd37b4c644c2921454429e7f9358d18a45e14)"
      required:
        - network_id
        - crypto_address
      properties:
        network_id:
          $ref: '#/components/schemas/NetworkId'
        crypto_address:
          type: string
          description: "The blockchain address (case-sensitive on some blockchains)"
          example: "0x165cd37b4c644c2921454429e7f9358d18a45e14"

    Asset:
      type: string
      title: "Asset"
      description: "ISO 4217 symbol representing a fiat asset."
      pattern: "^[A-Z]{3}$"
      minLength: 3
      maxLength: 3
      example: "USD"

    Address:
      type: object
      title: "Address"
      description: "Standardized physical address format used throughout the Dakota platform for user and entity addresses."
      required:
        - street1
        - city
        - country
      properties:
        street1:
          type: string
          description: "Primary street address line"
          example: "123 Main St"
        street2:
          type: string
          description: "Secondary address information such as apartment, suite, or unit number"
          example: "Apt 4B"
        street3:
          type: string
          description: "Additional address information like building name or floor"
          example: "Building C"
        city:
          type: string
          description: "City or locality name"
          example: "San Francisco"
        region:
          type: string
          description: "Full name of state, province, or region"
          example: "California"
        postal_code:
          type: string
          description: "Postal or ZIP code"
          example: "94105"
        country:
          type: string
          description: "ISO 3166-1 alpha-2 country code (two-letter country code)"
          example: "US"
          minLength: 2
          maxLength: 2

    Country:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: "^[A-Z]{2}$"
          minLength: 2
          maxLength: 2
          example: "CA"
        name:
          type: string
          example: "Canada"

    # Issuance API schemas
    IssuanceRequest:
      type: object
      description: "Request object for minting or burning digital assets on supported blockchain networks."
      properties:
        asset:
          type: string
          description: "Unique asset identifier for the token to mint or burn, such as 'USDC' or 'bealUSD'."
          example: "MYUSD"
        amount:
          type: string
          description: "Amount to mint/burn in common unit represented as a decimal string. Must be a valid numeric string."
          example: "100.00"
        target:
          type: string
          description: "Blockchain wallet address that will receive the minted tokens or from which tokens will be burned."
          example: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
        network_id:
          $ref: '#/components/schemas/NetworkId'
      required:
        - asset
        - amount
        - target
        - network_id
    
    IssuanceResponse:
      type: object
      description: "Response returned after a successful mint or burn operation with transaction details."
      properties:
        hash:
          type: string
          description: "Transaction hash of the operation that can be used to track the transaction on the blockchain."
          example: "0x3f5ce5fbfe3e9af3971dd833d26ba9b5c936f0be00f06fc13a42c20538dfaced"
    
    # KYB API schemas
    CustomerCreateRequest:
      type: object
      description: "Request to create a customer and subsequently initiate a Know Your Business (KYB) verification process."
      properties:
        name:
          type: string
          description: "Name of the customer - either a person's name or company name. Must contain at least one non-whitespace character."
          example: "Acme Corporation"
          minLength: 3
          maxLength: 100
          pattern: ".*\\S.*"
        customer_type:
          type: string
          description: "Type of entity being created - either an individual person or a company/organization."
          enum: [ individual, business ]
          example: "business"
        external_id:
          type: string
          description: "Unique identifier for the customer in the client's system. This ID is used to track the customer in the client's database."
          example: "external_customer_123"
        persona_inquiry_id:
          type: string
          description: "Optional Persona inquiry ID. If provided, the existing Persona inquiry will be used instead of creating a new one."
          example: "inq_12345678901234567890123456"
          x-internal: true
        is_client_application:
          type: boolean
          description: "Internal only. Set to true when onboarding a new client (not an end-user). Requires super admin permissions."
          default: false
          x-internal: true
      required:
        - name
        - customer_type
    CustomerCreateResponse:
      type: object
      description: "Response returned when a customer creation process is successfully initiated."
      required:
        - id
        - kyb_links
        - application_id
        - application_url
        - application_expires_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        kyb_links:
          type: array
          description: "KYB Links for different providers used in the KYB process."
          items:
            $ref: "#/components/schemas/KybLink"
        application_id:
          $ref: '#/components/schemas/KSUID'
          description: "Unique identifier for the automatically created application record"
        application_url:
          type: string
          format: uri
          description: "Public URL for completing the application via web form (includes embedded token)"
          example: "https://apply.dakota.com/applications/2WGC9cKv9P4K8eGzqY6qJ3Xz7Qm?token=kJ8xN3zQ9mL2pR5vY7wC1aF4dG6hK0sT8uW3nB5eM9"
        application_expires_at:
          type: integer
          format: int64
          description: "Unix timestamp (nanoseconds) when the application token expires (30 days from creation)"
          example: 1734567890000000000

    CustomerMigrateRequest:
      type: object
      description: "Request to migrate a customer from an existing Persona inquiry, optionally linking existing BVNK customer data."
      required:
        - customer_type
        - persona_case_id
      properties:
        customer_type:
          type: string
          description: "Type of entity being created - either an individual person or a business/organization."
          enum: [ individual, business ]
          example: "business"
        external_id:
          type: string
          description: "Unique identifier for the customer in the client's system."
          example: "legacy_customer_123"
        persona_case_id:
          type: string
          description: "Existing Persona case ID for this customer. Must be in format 'case_' followed by exactly 28 alphanumeric characters."
          example: "case_78hcsLcWUYVcyP5UbXdZPoNFTSHW"
          pattern: "^case_[a-zA-Z0-9]{28}$"
          minLength: 33
          maxLength: 33
        bvnk_customer_id:
          type: string
          description: "Existing BVNK customer reference ID if the customer already exists in BVNK"
          example: "bvnk_customer_123456"

    CustomerMigrateResponse:
      type: object
      description: "Response returned when a customer migration is successfully completed"
      required:
        - id
        - name
        - customer_type
        - persona_case_id
        - created_at
        - updated_at
        - onboarding_result
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        name:
          type: string
          description: "Name of the customer"
          example: "Acme Corporation"
        customer_type:
          type: string
          description: "Type of entity"
          enum: [ person, company ]
          example: "company"
        external_id:
          type: string
          description: "External identifier for the customer"
          example: "legacy_customer_123"
        persona_case_id:
          type: string
          description: "Linked Persona case ID"
          example: "case_78hcsLcWUYVcyP5UbXdZPoNFTSHW"
          pattern: "^case_[a-zA-Z0-9]{28}$"
        bvnk_customer_id:
          type: string
          description: "BVNK customer reference ID if provided or created during migration"
          example: "bvnk_customer_123456"
        created_at:
          type: integer
          format: int64
          description: "Unix timestamp when the customer was created"
          example: 1703097600
        updated_at:
          type: integer
          format: int64
          description: "Unix timestamp when the customer was last updated"
          example: 1703097600
        onboarding_result:
          $ref: '#/components/schemas/ProviderOnboardingResult'

    Customer:
      type: object
      description: "Response containing the current status of a KYB verification process including provider-specific statuses."
      required:
        - id
        - name
        - customer_type
        - kyb_status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        name:
          type: string
          description: "Name of the customer"
          example: "Acme Corp"
        email:
          type: string
          description: "Email address of the customer"
          example: "contact@acmecorp.com"
        customer_type:
          type: string
          description: "Type of entity - either an individual person or a company/organization"
          enum: [ person, company ]
          example: "company"
        kyb_status:
          $ref: "#/components/schemas/KybStatus"
        kyb_links:
          type: array
          description: "KYB Links for different providers used in the KYB process."
          items:
            $ref: "#/components/schemas/KybLink"
        provider_statuses:
          type: array
          description: "Detailed status information from different verification providers used in the KYB process."
          items:
            $ref: "#/components/schemas/ProviderKybStatus"
        application_id:
          $ref: '#/components/schemas/KSUID'
          description: "ID of the KYB application associated with this customer"
        decision:
          type: string
          description: "Application decision status"
          enum: [ approved, declined, auto_declined, withdrawn ]
          example: "approved"
        application_url:
          type: string
          description: "URL for accessing the onboarding application"
          example: "https://onboarding.example.com/applications/abc123?token=xyz789"
        created_at:
          type: integer
          description: "Timestamp of when the link was created"
          example: 1234567890
        updated_at:
          type: integer
          description: "Timestamp of when the link was last updated."
          example: 1234567890
        deleted_at:
          type: integer
          description: "Timestamp of when the link was deleted"
          example: 1234567890
    KybStatus:
      type: string
      description: "Overall status of the KYB verification process (e.g., pending, active, restricted)."
      example: "pending"
      enum: [ active, pending, partner_review, rejected, frozen ]
    ProviderKybStatus:
      type: object
      required:
        - provider_id
        - status
      properties:
        provider_id:
          type: string
          description: "ID of the verification provider or service used for a specific check."
          example: "trm_labs"
        status:
          type: string
          description: "Current verification status with this specific provider."
          example: "approved"
          enum: [ not_started, in_review, approved, rejected, requires_info, frozen ]
        endorsements:
          type: array
          items:
            type: string
          description: "Array of endorsements associated with this provider status."
    KybLink:
      type: object
      description: "Link to the KYB verification portal or dashboard for a specific provider."
      required:
        - provider_id
        - link_type
        - url
        - status
        - created_at
        - updated_at
      properties:
        provider_id:
          type: string
          description: "ID of the verification provider or service used for a specific check."
          example: "trm_labs"
        link_type:
          $ref: '#/components/schemas/KybLinkType'
        url:
          type: string
          description: "URL link to the KYB verification portal or dashboard where the entity can complete the verification process."
          example: "https://verify.provider.com/kyb/a1b2c3d4e5f6"
        status:
          $ref: '#/components/schemas/KybLinkStatus'
        created_at:
          type: integer
          description: "Timestamp of when the link was created"
          example: 1234567890
        updated_at:
          type: integer
          description: "Timestamp of when the link was last updated."
          example: 1234567890
        expires_at:
          type: integer
          description: "Timestamp of when the link will expire."
          example: 1234567890
        deleted_at:
          type: integer
          description: "Timestamp of when the link was deleted"
          example: 1234567890

    KybLinkType:
      type: string
      title: "KYB Link Type"
      description: "Type of link provided by a verification provider for KYB verification."
      enum: [ persona, tos ]
      example: "persona"
    
    KybLinkStatus:
      type: string
      title: "KYB Link Status"
      description: "Current status of the KYB verification link."
      enum: [ not_started, pending, expired, approved, rejected, in_review ]
      example: "pending"

    ApplicationStatus:
      type: string
      title: "Application Status"
      description: "Current status of an application in the onboarding flow."
      enum: [ pending, submitted, completed ]
      example: "pending"

    # Common enum types
    AssetSubset:
      type: string
      title: "Asset Subset"
      description: "Predefined subset of assets to filter by specific criteria."
      enum: [ rampable ]
      example: "rampable"

    Family:
      type: string
      title: "Family"
      description: "Blockchain family for the crypto account."
      enum: [ evm, solana ]
      example: "evm"

    PaymentCapability:
      type: string
      title: "Payment Capability"
      description: "Type of payment rail capability supported."
      enum: [ ach, fedwire, swift, sepa ]
      example: "ach"
    
    TransactionStatus:
      type: string
      title: "Transaction Status"
      description: "Current status of a transaction."
      enum: [ timed_out, not_started, in_progress, awaiting_confirmation, pending, processing, completed, invalid, failed, canceled, reversed, rejected, broadcasted, pending_return, returned ]

    TransactionType:
      type: string
      title: "Transaction Type"
      description: "Type of transaction."
      enum: [ onramp, offramp, swap ]
      example: "onramp"

    Capabilities:
      type: array
      title: "Capabilities"
      description: "List of payment capabilities supported by a rail. Currently, as input, you can only request one in this list. This constraint will be loosened in the future."
      items:
        $ref: '#/components/schemas/PaymentCapability'
      minItems: 1
      example: [ "ach", "fedwire" ]

    # On/Off Ramp API schemas
    OnrampAccountRequest:
      type: object
      title: "Onramp Account Request"
      description: "Schema for onramp account requests with capabilities for payment rails."
      required:
        - capabilities
        - source_asset
        - crypto_destination_id
        - destination_network_id
        - destination_asset
      properties:
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        rail:
          $ref: '#/components/schemas/PaymentCapability'
        crypto_destination_id:
          $ref: '#/components/schemas/KSUID'
          description: "Crypto destination ID to receive the onramped asset."
        destination_network_id:
          $ref: '#/components/schemas/NetworkId'
        source_asset:
          $ref: '#/components/schemas/Asset'
        destination_asset:
          type: string
          description: "Asset to receive at the destination."
          example: "USDC"
          minLength: 1
        developer_fee_bps:
          type: integer
          format: int32
          description: "Developer fee in basis points (1 bp = 0.01%). Only available for authorized clients."
          example: 50
          minimum: 0
          maximum: 10000

    OnrampAccountUpdateRequest:
      type: object
      title: "Onramp Account Update Request"
      description: "Schema for onramp account updates with capabilities for payment rails."
      properties:
        crypto_destination_id:
          $ref: '#/components/schemas/KSUID'
          description: "Crypto destination ID to receive the onramped asset."
        destination_network_id:
          $ref: '#/components/schemas/NetworkId'
        destination_asset:
          type: string
          description: "Asset to receive at the destination."
          example: "USDC"

    OnrampAccountResponse:
      type: object
      title: "Onramp Account Response"
      description: "Schema for onramp account responses with capabilities for payment rails."
      required:
        - id
        - bank_account
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        bank_account:
          $ref: '#/components/schemas/BankAccount'
        destination:
          $ref: '#/components/schemas/CryptoDestinationResponse'
        destination_asset:
          type: string
          description: "Asset to receive at the destination."
          example: "USDC"
        rail:
          $ref: '#/components/schemas/PaymentCapability'
          description: "Payment rail used for this onramp account"
          example: "ach"

    # Unified fiat account response schema
    BankAccount:
      type: object
      title: "Bank Account"
      description: "Unified schema for bank accounts."
      required:
        - id
        - capabilities
        - account_holder_name
        - bank_name
        - bank_address
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        # US/ACH/Fedwire fields
        aba_routing_number:
          type: string
          description: "ABA routing number for US accounts for general purposes incl. ACH."
          example: "123456789"
        aba_wire_routing_number:
          type: string
          description: "ABA routing number for wire transfers (if different)."
          example: "123456789"
        account_number:
          type: string
          description: "Account number for the US bank account."
          example: "123456789"
        account_type:
          type: string
          description: "Type of bank account (for US accounts)."
          enum: [ checking, savings ]
          example: "checking"
        # Non-US fields
        bic:
          type: string
          description: "BIC/SWIFT code for the international bank account."
          example: "DEUTDEFFXXX"
        iban:
          type: string
          description: "IBAN for the international bank account."
          example: "DE89370400440532013000"
        # Common fields
        account_holder_name:
          type: string
          description: "Name of the account holder."
          example: "John Doe"
        account_holder_address:
          $ref: '#/components/schemas/Address'
          description: "Address of the account holder."
        account_holder_phone:
          type: string
          description: "Phone number of the account holder."
          example: "1234567890"
        bank_name:
          type: string
          description: "Name of the bank."
          example: "Bank of America"
        bank_address:
          $ref: '#/components/schemas/Address'
          description: "Address of the bank."
        bank_phone:
          type: string
          description: "Phone number of the bank."
          example: "+12345678900"

    OfframpAccountRequest:
      type: object
      required:
        - source_asset
        - fiat_destination_id
        - destination_asset
        - rail
        - source_network_id
      properties:
        fiat_destination_id:
          $ref: '#/components/schemas/KSUID'
          description: "Fiat destination (bank) ID to receive the offramp proceeds."
        destination_asset:
          $ref: '#/components/schemas/Asset'
        rail:
          $ref: '#/components/schemas/PaymentCapability'
        source_asset:
          type: string
          description: "Asset to send into the account, indicated by symbol. Use 'any' to accept any supported asset (USDC, USDT, DKUSD)."
          example: "USDC"
          minLength: 1
        source_network_id:
          type: string
          description: "Network ID (e.g., ethereum-mainnet, base-mainnet, polygon-mainnet) or 'evm' to accept any EVM mainnet chain we currently support."
          example: "ethereum-mainnet"
        return_address:
          $ref: '#/components/schemas/CRI'
          description: |
            Optional address to return crypto back to if the transaction fails.

            **Validation Rules:**

            1. **Specific network** (e.g., `source_network_id: "ethereum-mainnet"`):
               - At account creation, the return address network must exactly match the source network.
               - At transaction time, failed transactions are returned to this address.

            2. **EVM wildcard** (`source_network_id: "evm"`):
               - At account creation, the return address must be any EVM network we support (ethereum-mainnet, base-mainnet, polygon-mainnet, arbitrum-mainnet, optimism-mainnet, avalanche-mainnet).
               - At transaction time, if the actual transaction network matches the return address network, failed transactions are returned to this address.
               - If the networks don't match, the system falls back to return-to-sender (sender's address).

            3. **Not provided**:
               - Failed transactions are automatically returned to the sender's address (return-to-sender policy).
        developer_fee_bps:
          type: integer
          format: int32
          description: "Developer fee in basis points (1 bp = 0.01%). Only available for authorized clients."
          example: 50
          minimum: 0
          maximum: 10000

    OfframpAccountResponse:
      type: object
      allOf:
        - type: object
          required:
            - id
            - source_network_id
            - source_crypto_address
            - source_family
          properties:
            id:
              $ref: '#/components/schemas/KSUID'
            source_crypto_address:
              type: string
              description: "Blockchain address for the crypto account."
              example: "0x1234"
            source_family:
              $ref: '#/components/schemas/Family'
            source_network_id:
              $ref: '#/components/schemas/NetworkId'
            destination:
              $ref: '#/components/schemas/DestinationResponseUnion'
            source_asset:
              type: string
              description: "Asset to send into the account"
              example: "USDC"
            destination_asset:
              $ref: '#/components/schemas/Asset'
            destination_rail:
              $ref: '#/components/schemas/PaymentCapability'
              description: "Payment rail used for this offramp account"
              example: "ach"

    OfframpAccountUpdateRequest:
      type: object
      title: "Offramp Account Update Request"
      description: "Schema for offramp account updates"
      properties:
        fiat_destination_id:
          $ref: '#/components/schemas/KSUID'
          description: "Fiat destination (bank) ID to receive the offramp proceeds."

    SwapAccountRequest:
      type: object
      required:
        - crypto_destination_id
        - destination_network_id
        - destination_asset
        - source_asset
        - source_network_id
      properties:
        crypto_destination_id:
          $ref: '#/components/schemas/KSUID'
          description: "Crypto destination ID to receive the swapped asset."
        destination_network_id:
          $ref: '#/components/schemas/NetworkId'
        destination_asset:
          type: string
          description: "Asset to receive at the destination."
          example: "USDC"
          minLength: 1
        source_asset:
          type: string
          description: "Asset to send into the account. Use 'any' to accept any supported asset (USDC, USDT, DKUSD)."
          example: "USDC"
          minLength: 1
        source_network_id:
          type: string
          description: "Network ID (e.g., ethereum-mainnet, base-mainnet, polygon-mainnet) or 'evm' to accept any EVM mainnet chain we currently support."
          example: "ethereum-mainnet"
        return_crypto_address:
          $ref: '#/components/schemas/CRI'
          description: |
            Optional address to return crypto back to if the transaction fails.

            **Validation Rules:**

            1. **Specific network** (e.g., `source_network_id: "ethereum-mainnet"`):
               - At account creation, the return address network must exactly match the source network.
               - At transaction time, failed transactions are returned to this address.

            2. **EVM wildcard** (`source_network_id: "evm"`):
               - At account creation, the return address must be any EVM network we support (ethereum-mainnet, base-mainnet, polygon-mainnet, arbitrum-mainnet, optimism-mainnet, avalanche-mainnet).
               - At transaction time, if the actual transaction network matches the return address network, failed transactions are returned to this address.
               - If the networks don't match, the system falls back to return-to-sender (sender's address).

            3. **Not provided**:
               - Failed transactions are automatically returned to the sender's address (return-to-sender policy).
        developer_fee_bps:
          type: integer
          format: int32
          description: "Developer fee in basis points (1 bp = 0.01%). Only available for authorized clients."
          example: 50
          minimum: 0
          maximum: 10000

    SwapAccountResponse:
      type: object
      required:
        - id
        - source_crypto_address
        - source_network_id
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        source_crypto_address:
          type: string
          example: "0x1234"
        source_network_id:
          $ref: '#/components/schemas/NetworkId'
        destination:
          $ref: '#/components/schemas/DestinationResponseUnion'
        source_asset:
          type: string
          description: "Asset to send into the account."
          example: "USDC"
        destination_asset:
          type: string
          description: "Asset to receive at the destination."
          example: "USDC"

    # Recipients API schemas
    # Union type for destination requests
    DestinationRequestUnion:
      title: "Destination Request Union"
      description: "Union type for different destination requests with destination_type discriminator"
      oneOf:
        - $ref: '#/components/schemas/CryptoDestinationRequest'
        - $ref: '#/components/schemas/FiatUSDestinationRequest'
        - $ref: '#/components/schemas/FiatIBANDestinationRequest'
      discriminator:
        propertyName: destination_type
        mapping:
          crypto: '#/components/schemas/CryptoDestinationRequest'
          fiat_us: '#/components/schemas/FiatUSDestinationRequest'
          fiat_iban: '#/components/schemas/FiatIBANDestinationRequest'

    # Base destination request with discriminator
    DestinationRequest:
      type: object
      title: "Destination Request"
      description: "Base schema for destination requests with a discriminator based on destination type."
      required:
        - destination_type
      properties:
        destination_type:
          type: string
          description: "The type of destination."
          enum: [ crypto, fiat_us, fiat_iban ]
      discriminator:
        propertyName: destination_type
        mapping:
          crypto: '#/components/schemas/CryptoDestinationRequest'
          fiat_us: '#/components/schemas/FiatUSDestinationRequest'
          fiat_iban: '#/components/schemas/FiatIBANDestinationRequest'
    
    # Crypto destination request
    CryptoDestinationRequest:
      type: object
      title: "Crypto Destination Request"
      description: "Request for creating or updating a cryptocurrency destination."
      allOf:
        - $ref: '#/components/schemas/DestinationRequest'
        - type: object
          properties:
            destination_type:
              type: string
              enum: [ crypto ]
              default: crypto
            name:
              type: string
              description: "Name of the destination for reference"
