          description: Application decision calculated and applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateDecisionResponse'
        "400":
          description: Not all entities have decisions yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
