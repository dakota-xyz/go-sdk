      operationId: syncBridgeCustomerId
      tags:
        - Onboarding
        - Internal
      summary: Sync Bridge Customer ID to Platform
      description: |
        Endpoint for Dakota to sync a Bridge Customer ID to the Platform customer's KYB status.
        This creates or updates a KYB status record for the customer with provider_id = "bridge"
        and provider_external_id = bridge_customer_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dakota_organization_id
                - bridge_customer_id
              properties:
                dakota_organization_id:
                  type: string
                  description: Dakota organization ID (maps to Platform customer external_id)
                  example: "01ARZ3NDEKTSV4RRFFQ69G5FAV"
                  minLength: 1
                bridge_customer_id:
                  type: string
                  description: Bridge customer ID to store as provider_external_id
                  example: "cus_1234567890abcdef"
                  minLength: 1
      responses:
        "200":
          description: Bridge Customer ID synced successfully
