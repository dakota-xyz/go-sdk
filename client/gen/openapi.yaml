      tags:
        - Onboarding
        - Internal
      summary: Calculate application decision from entity decisions
      description: |
        Calculates and applies an application-level decision based on the decisions of all entities.
        Logic: If any entity is declined/auto_declined/withdrawn, the application is declined.
        If all entities are approved, the application is approved.
        Returns an error if not all entities have decisions yet.
        This endpoint is for superadmin use only.
