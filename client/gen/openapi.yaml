  /internal/views/applications:
    get:
      tags:
        - Internal
      summary: List all applications across all clients (superadmin view)
      description: |
        Returns a list of all applications across all clients. Superadmin only.
        Supports search by business name or individual name.
        Can be filtered by type and status. Supports pagination.
      operationId: listApplicationsView
      parameters:
        - name: search
          in: query
          required: false
          description: Search by business name or individual name
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter by application type
          schema:
            type: string
            enum:
              - business
              - individual
        - name: status
          in: query
          required: false
          description: Filter by application status
          schema:
            type: string
            enum:
              - pending
              - submitted
              - completed
        - $ref: '#/components/parameters/StartingAfterParam'
        - $ref: '#/components/parameters/EndingBeforeParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: List of applications with client information
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationViewItem'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

