  # Sandbox Endpoints - Only available when IS_SANDBOX=true
  /sandbox/transactions/{transaction_id}/simulate:
    post:
      tags:
        - Sandbox
      summary: Simulate transaction progress
      description: Manually progress a transaction to a new state in sandbox mode
      operationId: simulateTransactionProgress
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
          description: Transaction ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - processing
                    - completed
                    - failed
                  description: New status for the transaction
                error_message:
                  type: string
                  description: Optional error message if status is failed
      responses:
        '200':
          description: Transaction state updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Transaction progressed to completed"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not available in production mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sandbox/accounts/{account_id}/simulate:
    post:
      tags:
        - Sandbox
      summary: Simulate account activity
      description: |
        Simulate incoming funds to an account. Automatically detects account type and generates appropriate webhooks:
        - **Onramp accounts** (fiat → crypto): Simulates virtual_account.activity webhooks for wire/ACH deposits
        - **Offramp accounts** (crypto → fiat): Simulates liquidation_address.drain webhooks for crypto deposits
      operationId: simulateAccountActivity
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: Account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  description: Amount of funds to simulate
                  example: "100.00"
                currency:
                  type: string
                  description: Currency code (must match account's input_asset)
                  example: "USD"
                reference:
                  type: string
                  description: Optional reference for the transaction
                  example: "Test transaction"
                target_state:
                  type: string
                  description: |
                    Target state for simulation. Defaults to the final state which simulates the full flow.
                    - For onramps: funds_received, payment_submitted, or payment_processed
                    - For offramps: created, pending, or completed
                  enum:
                    - funds_received
                    - payment_submitted
                    - payment_processed
                    - created
                    - pending
                    - completed
                  example: "payment_processed"
      responses:
        '200':
          description: Account activity simulation initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Account activity simulation initiated"
                  webhook_id:
                    type: string
                    description: ID of the created webhook
                  transaction_type:
                    $ref: '#/components/schemas/TransactionType'
        '400':
          description: Invalid request (e.g., currency mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found or not available in production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sandbox/customers/{customer_id}/kyb/simulate:
    post:
      tags:
        - Sandbox
      summary: Simulate KYB status update
      description: Simulate a KYB approval or rejection for a customer
      operationId: simulateKYBUpdate
      parameters:
