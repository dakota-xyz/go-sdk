      summary: Sign HAWK authentication for BVNK API requests
      operationId: signHawk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - url
              properties:
                method:
                  type: string
                  description: HTTP method for the request to be signed
                  example: "GET"
                url:
                  type: string
                  description: Full URL of the request to be signed
                  example: "https://api.bvnk.com/platform/v1/customers"
                body:
                  type: string
                  description: Request body (empty string for GET requests)
                  example: ""
      responses:
        "200":
          description: Successfully generated HAWK authorization header
          content:
            application/json:
              schema:
                type: object
                properties:
                  Authorization:
                    type: string
                    description: HAWK authorization header value
                    example: "Hawk id=\"api-key-id\", ts=\"1640995200\", nonce=\"abc123\", mac=\"base64-encoded-mac\""
